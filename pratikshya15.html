<!DOCTYPE html>
<html>
<body>

<h3>Array Choices</h3>
<button onclick="Choices()">Show Choices</button>
<p id="po"></p>

<script>
function Choices(){
 let color = ["Blue", "Green", "Red", "Orange", "Violet", "Indigo", "Yellow"];
 let o = ["th","st","nd","rd"];
 let s = "";
 for(let i=0;i<color.length;i++){
   let suffix = (i+1<=3)?o[i+1]:o[0];
   s += (i+1)+suffix+" choice is "+color[i]+".<br>";
 }
 po.innerHTML=s;
}
</script>

</body>
</html>
