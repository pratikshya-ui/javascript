<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
    <style>
        body{
            font-family: Arial;
            font-size: 12pt;
            background: #f2f2f2;
            padding: 10px;
        }
        form{
            width: 350px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: auto;
        }
        label{
            font-weight:bold;
            display:block;
            margin-bottom:3px;
        }
        input, select, textarea{
            width: 100%;
            padding: 6px;
            margin-bottom: 8px;
            border: 1px solid #777;
            border-radius: 4px;
            font-size: 11pt;
        }
        textarea{
            height: 50px;
        }
        .error{
            color: red;
            font-size: 10pt;
            margin-top: -6px;
            margin-bottom: 6px;
        }
        button{
            padding: 8px 12px;
            font-size: 11pt;
            border: none;
            background: #0066cc;
            color: white;
            border-radius: 4px;
            cursor:pointer;
        }
        button:hover{
            background:#004d99;
        }
        .btn-reset{
            background:red;
        }
        .gender-box{
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<h3 style="text-align:center;">Registration Form</h3>

<form onsubmit="return validateForm()">

    <label>Name</label>
    <input type="text" id="name">
    <div class="error" id="nameErr"></div>

    <label>Address</label>
    <input type ="text" id="address">
    <div class="error" id="addressErr"></div>

    <label>Username</label>
    <input type="text" id="username">
    <div class="error" id="usernameErr"></div>

    <label>Email</label>
    <input type="text" id="email">
    <div class="error" id="emailErr"></div>

    <label>Password</label>
    <input type="password" id="password">
    <div class="error" id="passwordErr"></div>

    <label>Website</label>
    <input type="text" id="website">
    <div class="error" id="websiteErr"></div>

    <label>Phone</label>
    <input type="text" id="phone">
    <div class="error" id="phoneErr"></div>

    <label>Gender</label>
<div class="gender-group">
    <input type="radio" name="gender" value="Male"> Male 
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
</div>
<span class="error" id="genderErr"></span>


    <label>Course</label>
    <select id="course">
        <option value="">--Select--</option>
        <option>BBA</option>
        <option>BCA</option>
        <option>BBM</option>
    </select>
    <div class="error" id="courseErr"></div>

    <button type="submit">Submit</button>
    <button type="reset" class="btn-reset">Reset</button>

</form>

<script>
function validateForm(){

    document.querySelectorAll('.error').forEach(e => e.innerHTML = "");

    let name = document.getElementById("name").value.trim();
    let address = document.getElementById("address").value.trim();
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value.trim();
    let website = document.getElementById("website").value.trim();
    let phone = document.getElementById("phone").value.trim();
    let gender = document.querySelector("input[name='gender']:checked");
    let course = document.getElementById("course").value;

    let valid = true;

    if(name === "" || /\d/.test(name)){
        nameErr.innerHTML = "Invalid name!";
        valid = false;
    }

    if(address === ""){
        addressErr.innerHTML = "Address required!";
        valid = false;
    }

    if(username === "" || /[^A-Za-z0-9_]/.test(username)){
        usernameErr.innerHTML = "Only letters, numbers & '_' allowed!";
        valid = false;
    }

    if(email === "" || !email.includes("@")){
        emailErr.innerHTML = "Invalid email!";
        valid = false;
    }

    if(password === "" || password.length < 8 ||
       !/[A-Z]/.test(password) ||
       !/[a-z]/.test(password) ||
       !/[0-9]/.test(password) ||
       !/[^A-Za-z0-9]/.test(password)){
        passwordErr.innerHTML = "Weak password!";
        valid = false;
    }

    if(website !== "" && !website.match(/^(https?:\/\/)?[\w.-]+\.\w+$/)){
        websiteErr.innerHTML = "Invalid website!";
        valid = false;
    }

    if(phone === "" || !/^(98|97|96)[0-9]{8}$/.test(phone)){
        phoneErr.innerHTML = "Invalid number!";
        valid = false;
    }

    if(!gender){
        genderErr.innerHTML = "Select gender!";
        valid = false;
    }

    if(course === ""){
        courseErr.innerHTML = "Choose a course!";
        valid = false;
    }

    return valid;
}
</script>

</body>
</html>
