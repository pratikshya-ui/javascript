<!DOCTYPE html>
<html>
<body>
<h3>Alphabetical Order of String</h3>

<input id="str" type="text" placeholder="Enter string">
<button onclick="sortString()">Sort</button>

<p id="you"></p>

<script>
function sortString() {
    let s = document.getElementById("str").value;
    let sorted = s.split("").sort().join("");
    document.getElementById("you").innerHTML = sorted;
}
</script>

</body>
</html>
