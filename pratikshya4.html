<!DOCTYPE html>
<html>
<body>

<h3>Capitalize Words</h3>
Sentence: <input id="str" size="20">
<button onclick="cap()">Convert</button>
<p id="th"></p>

<script>
function cap() {
  let s = document.getElementById("str").value.split(" ");
  for (let i = 0; i < s.length; i++)
    s[i] = s[i][0].toUpperCase() + s[i].slice(1);
  document.getElementById("th").innerHTML = s.join(" ");
}
</script>

</body>
</html>
