<!DOCTYPE html>
<html>
<head>
    <title>Cookie</title>
    <style>
        body{
            font-family: Arial;
            padding: 20px;
        }
        table{
            border-collapse: collapse;
            width: 40%;
            margin-top: 20px;
        }
        table, th, td{
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<h2>Cookie Operations</h2>

<!-- Input fields -->
<label>Enter Key:</label>
<input type="text" id="key"><br><br>

<label>Enter Value:</label>
<input type="text" id="value"><br><br>

<!-- Buttons -->
<button onclick="addCookie()">Add Cookie</button>
<button onclick="readCookie()">Read Cookie</button>
<button onclick="showAllCookies()">Show All Cookies</button>
<button onclick="deleteCookie()">Delete Cookie</button>
<button onclick="deleteAllCookies()">Delete All Cookies</button>

<h3>Output:</h3>
<div id="output"></div>

<script>

// a. Add cookie
function addCookie(){
    let key = document.getElementById("key").value;
    let val = document.getElementById("value").value;

    if(key==""){
        alert("Enter key!");
        return;
    }

    document.cookie = key + "=" + val + "; path=/";
    document.getElementById("output").innerHTML = "Cookie added!";
}

// b. Read cookie by key
function readCookie(){
    let key = document.getElementById("key").value;
    let cookies = document.cookie.split("; ");

    for(let c of cookies){
        let [k, v] = c.split("=");
        if(k === key){
            document.getElementById("output").innerHTML = 
                "Value of '" + key + "' is: " + v;
            return;
        }
    }
    document.getElementById("output").innerHTML = "Cookie not found!";
}

// c. Show all cookies in table
function showAllCookies(){
    let cookies = document.cookie.split("; ");
    let table = "<table><tr><th>Key</th><th>Value</th></tr>";

    if(document.cookie === ""){
        document.getElementById("output").innerHTML = 
            "No cookies found!";
        return;
    }

    for(let c of cookies){
        let [k, v] = c.split("=");
        table += "<tr><td>" + k + "</td><td>" + v + "</td></tr>";
    }

    table += "</table>";
    document.getElementById("output").innerHTML = table;
}

// d. Delete cookie by key
function deleteCookie(){
    let key = document.getElementById("key").value;
    document.cookie = key + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    document.getElementById("output").innerHTML = "Cookie deleted ";
}

// e. Delete all cookies
function deleteAllCookies(){
    let cookies = document.cookie.split("; ");

    for(let c of cookies){
        let [k, v] = c.split("=");
        document.cookie = k + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    document.getElementById("output").innerHTML = "All cookies deleted!";
}

</script>

</body>
</html>
