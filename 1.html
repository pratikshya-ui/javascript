<!DOCTYPE html>
<html>
<body>
<h3>Reverse of Number</h3>

<input id="num" type="number" placeholder="Enter a number">
<button onclick="reverse()">Reverse</button>

<p id="out"></p>

<script>
function reverse() {
    let n = document.getElementById("num").value;
    let rev = n.split("").reverse().join("");
    document.getElementById("out").innerHTML = "Reversed: " + rev;
}
</script>

</body>
</html>
