<!DOCTYPE html>
<html>
<body>
<input id="a" placeholder="1st number"><br>
<input id="b" placeholder="2nd number"><br>
<button onclick="fun()">Check</button>
<p id="of"></p>

<script>
function fun(){
 let x=+document.getElementById("a").value;
 let y=+document.getElementById("b").value;
 document.getElementById("of").innerHTML=
 "Larger: "+Math.max(x,y)+"<br>Smaller: "+Math.min(x,y);
}
</script>
</body>
</html>
